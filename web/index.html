<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>VOLLEY CONTROL</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pvi-volley-control-v3-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pvi-volley-control-v3-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10233d" />
    <meta name="apple-mobile-web-app-title" content="Volley Control" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="hero"><div class="hero-in">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M3.5 9c5 1 9 4 11 11M20 8c-5-1-9 1-12 6" />
            </svg>
          </span>
          <h1>VOLLEY CONTROL</h1>
          <p>Calendario settimanale · FIPAV · PGS</p>
        </div>
        <nav class="top">
          <button id="home">Home</button><span id="identity"></span
          ><button id="access">Area personale</button
          ><button id="patty">🔒 PATTY <span id="pending-dot"></span></button>
        </nav>
      </div></header>
    <main id="app">
      <div id="message" role="status" aria-live="polite"></div>
      <section id="admin" hidden></section>
      <div class="layout">
        <aside class="side">
          <nav id="weeks" aria-label="Settimane delle gare"></nav>
          <h2 id="title">Caricamento…</h2>
          <div id="metrics" class="metrics"></div>
          <div id="summary"></div>
          <div class="legend">
            <span><i class="dot covered">✓</i> Coperto</span
            ><span><i class="dot missing">!</i> Mancante</span><span>Trasferta: nessun posto da coprire</span>
          </div>
        </aside>
        <section id="games" aria-label="Calendario partite"></section>
      </div>
    </main>
    <dialog id="dialog">
      <div class="dialog-top">
        <h2 id="dialog-title"></h2>
        <button id="close-dialog" aria-label="Chiudi finestra">✕</button>
      </div>
      <div id="dialog-content"></div>
      <p id="dialog-message" role="status" aria-live="polite"></p>
    </dialog>
  </body>
</html>
